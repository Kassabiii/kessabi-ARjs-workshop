<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Location-based object · AR demo</title>
    <meta name="description" content="Pin a spot on the map, then find a 3D satellite there through your phone's camera. Built with AR.js, A-Frame and Leaflet.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="shared/ar.css?v=3">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
    <!-- Pinned to the last commit of the archived AR.js repo (same file raw.githack served from master). -->
    <script defer src="https://cdn.jsdelivr.net/gh/jeromeetienne/AR.js@024318c67121bd57045186b83b42f10c6560a34a/aframe/build/aframe-ar.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@676f3628bb477d646293f9743eda31aca556114a/dist/aframe-extras.loaders.min.js"></script>
    <script defer src="shared/ar.js?v=2"></script>
    <style>
        #ar-intro.map-intro { padding: 0; display: flex; flex-direction: column; }
        #map { flex: 1; min-height: 200px; }
        #map-panel {
            background: var(--surface);
            border-top: 1px solid var(--line);
            padding: 0.75rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
            display: grid;
            gap: 0.6rem;
        }
        #map-panel .ar-back { min-height: 36px; }
        #map-panel h1 { margin: 0; font-size: 1.25rem; }
        #map-hint { color: var(--muted); font-size: 0.95rem; line-height: 1.45; margin: 0; }
        #coords-display { color: var(--accent); font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="ar-page">
    <main id="ar-intro" class="ar-panel map-intro">
        <div id="map" aria-label="Map: tap to place the satellite"></div>
        <div id="map-panel">
            <a class="ar-back" href="../index.html">← Portfolio</a>
            <h1>Location-based object</h1>
            <p id="map-hint">Tap the map close to where you are (within about 200 m) to place a satellite there. Then go outside and look for it through your camera.</p>
            <p id="coords-display">No location picked yet</p>
            <div class="ar-actions">
                <button id="locate-me" class="ar-btn" type="button">Show my location</button>
                <button id="ar-start" class="ar-btn primary" type="button" disabled>Start camera</button>
            </div>
        </div>
    </main>

    <section id="ar-error" class="ar-panel" hidden aria-live="assertive">
        <div class="ar-panel-inner">
            <a class="ar-back" href="../index.html">← Portfolio</a>
            <div class="ar-error-icon" aria-hidden="true">!</div>
            <h1 id="ar-error-title">Camera is blocked</h1>
            <p id="ar-error-text"></p>
            <div class="ar-actions"><button id="ar-retry" class="ar-btn primary" type="button">Try again</button></div>
        </div>
    </section>

    <a id="ar-back-float" class="ar-back ar-back-float" href="../index.html" hidden>← Portfolio</a>
    <div id="ar-status" class="ar-status" role="status" aria-live="polite" hidden></div>

    <script>
        let res = { w: 1280, h: 720 };
        try { res = JSON.parse(localStorage.getItem('arResolution')) || res; } catch (e) {}

        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const startBtn = document.getElementById('ar-start');
        const hint = document.getElementById('map-hint');
        let marker = null;
        let pickedLat = null, pickedLng = null;

        map.on('click', (e) => {
            pickedLat = e.latlng.lat;
            pickedLng = e.latlng.lng;
            if (marker) marker.setLatLng(e.latlng);
            else marker = L.marker(e.latlng).addTo(map);
            document.getElementById('coords-display').textContent =
                `Lat ${pickedLat.toFixed(5)}, Lng ${pickedLng.toFixed(5)}`;
            startBtn.disabled = false;
        });

        document.getElementById('locate-me').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;
            btn.textContent = 'Finding you…';
            try {
                const pos = await ARShell.requestLocation();
                map.setView([pos.coords.latitude, pos.coords.longitude], 17);
                hint.textContent = 'This is where you are. Tap a spot nearby to place the satellite.';
            } catch (kind) {
                hint.textContent = kind === 'location-denied'
                    ? 'Location is blocked, so find your area on the map yourself. The camera step still needs location access.'
                    : 'Couldn\'t find your location. Find your area on the map yourself.';
            }
            btn.disabled = false;
            btn.textContent = 'Show my location';
        });

        document.getElementById('ar-retry').addEventListener('click', () => location.reload());

        startBtn.addEventListener('click', async () => {
            if (!ARShell.librariesLoaded()) {
                ARShell.showError('library');
                return;
            }
            startBtn.disabled = true;
            startBtn.textContent = 'Starting…';
            try {
                await ARShell.requestCamera();
                await ARShell.requestLocation();
            } catch (kind) {
                ARShell.showError(typeof kind === 'string' ? kind : 'generic');
                return;
            }

            ARShell.enterCamera();
            ARShell.status('Starting camera…');

            const scene = document.createElement('a-scene');
            scene.setAttribute('vr-mode-ui', 'enabled: false');
            scene.setAttribute('embedded', '');
            scene.setAttribute('arjs',
                `sourceType: webcam; sourceWidth: ${res.w}; sourceHeight: ${res.h}; debugUIEnabled: false; cameraParametersUrl: markers/camera_para.dat;`
            );

            const entity = document.createElement('a-entity');
            entity.setAttribute('gltf-model', 'models/saturn-orbiter.gltf');
            entity.setAttribute('rotation', '0 180 0');
            // About 20 m across, so it's visible from a street or park away.
            entity.setAttribute('scale', '3 3 3');
            entity.setAttribute('gps-entity-place', `latitude: ${pickedLat}; longitude: ${pickedLng};`);
            entity.setAttribute('animation-mixer', '');
            scene.appendChild(entity);

            const camera = document.createElement('a-camera');
            camera.setAttribute('gps-camera', '');
            camera.setAttribute('rotation-reader', '');
            scene.appendChild(camera);

            document.body.appendChild(scene);

            try {
                await ARShell.waitForVideo();
            } catch (kind) {
                ARShell.showError(kind);
                return;
            }
            ARShell.status('Look around for the satellite');

            // AR.js positions the satellite in metres relative to the camera, so the
            // distance can be read from the scene. (Its own distance event only fires
            // when the GPS position changes.)
            setInterval(() => {
                const c = camera.object3D.position, p = entity.object3D.position;
                if (p.x === 0 && p.z === 0) return; // not placed yet
                const dist = Math.round(Math.hypot(p.x - c.x, p.z - c.z));
                ARShell.status(`Satellite is ${dist} m away. Look around for it.`);
            }, 1000);
        });
    </script>
</body>
</html>
